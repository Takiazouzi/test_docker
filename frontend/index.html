<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Login Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: linear-gradient(135deg, #e8f0ff, #f6f8fc);
      color: #1e293b; padding: 24px;
    }
    main {
      width: min(100%, 430px); background: white; padding: 34px;
      border-radius: 20px; box-shadow: 0 18px 50px #1e293b18;
    }
    .tag { color: #315cbd; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0; font-size: 1.8rem; }
    p { color: #64748b; line-height: 1.55; }
    label { display: block; font-weight: 600; margin: 18px 0 7px; }
    input {
      width: 100%; border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 12px 13px; font: inherit;
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0;
      border-radius: 10px; background: #315cbd; color: white;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #24499c; }
    #message { margin-top: 18px; }
    .success { padding: 14px; border-radius: 10px; background: #e9f9ef; color: #17663a; }
    .error { padding: 14px; border-radius: 10px; background: #fff0f0; color: #a12626; }
    .hidden { display: none; }
    .hint { font-size: .85rem; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Docker · Multi-container lab</div>
    <section id="login-view">
      <h1>Bienvenue 👋</h1>
      <p>Connectez-vous pour vérifier le déploiement de l'application.</p>
      <form id="login-form">
        <label for="username">Identifiant</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Se connecter</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <p class="hint">Compte de démonstration : <strong>student</strong> / <strong>DockerLab123!</strong></p>
    </section>
    <section id="success-view" class="hidden">
      <h1>🎉 Félicitations !</h1>
      <div id="success-message" class="success"></div>
      <p>Le frontend, le backend et la base de données communiquent correctement.</p>
      <button id="logout-button" type="button">Retour à la connexion</button>
    </section>
  </main>
  <script>
    const form = document.querySelector("#login-form");
    const message = document.querySelector("#message");
    const loginView = document.querySelector("#login-view");
    const successView = document.querySelector("#success-view");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "";
      message.textContent = "Vérification en cours…";
      const username = document.querySelector("#username").value;
      const password = document.querySelector("#password").value;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if (response.ok && result.success) {
          document.querySelector("#success-message").textContent = result.message;
          loginView.classList.add("hidden");
          successView.classList.remove("hidden");
        } else {
          message.className = "error";
          message.textContent = result.message || "Échec de la connexion.";
        }
      } catch (error) {
        message.className = "error";
        message.textContent = "Impossible de contacter le backend. Vérifiez les conteneurs et le réseau.";
      }
    });

    document.querySelector("#logout-button").addEventListener("click", () => {
      form.reset();
      message.textContent = "";
      message.className = "";
      successView.classList.add("hidden");
      loginView.classList.remove("hidden");
    });
  </script>
</body>
</html>
